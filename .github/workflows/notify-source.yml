name: Notify source release

run-name: Resume prepared releases in ${{ inputs.source_repository }}

on:
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository whose bottle publication completed
        required: true
        type: choice
        options:
          - lynnswap/XcodeMCPKit
          - lynnswap/PrivateHeaderKit

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: source-notification
    permissions:
      contents: read
    steps:
      - name: Check out trusted notification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Select the registered source repository
        id: source
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          python3 scripts/notify_sources.py prepare --repo "$SOURCE_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create a token scoped to source workflow dispatch
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_DISPATCH_APP_PRIVATE_KEY }}
          owner: lynnswap
          repositories: ${{ steps.source.outputs.repository }}
          permission-actions: write
      - name: Resume approved source delivery verification
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: python3 scripts/notify_sources.py dispatch --repo "$SOURCE_REPOSITORY"
