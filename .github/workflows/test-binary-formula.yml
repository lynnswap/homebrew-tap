name: Test upstream binary Formula

on:
  workflow_call:
    inputs:
      pull_request:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      source_tag:
        description: Expected upstream version for a release-dispatched update
        required: false
        type: string
      source_sha:
        description: Expected upstream commit for a release-dispatched update
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          brew-gh-api-token: ${{ github.token }}
      - name: Checkout trusted verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Install the published archive from the proposed Formula
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 "$GITHUB_WORKSPACE/trusted/scripts/binary_formula.py" verify --repo "$GITHUB_REPOSITORY" \
            --pr "$PULL_REQUEST" --head "$HEAD_SHA" --tap-root "$(brew --repository lynnswap/tap)" \
            --source-tag "$SOURCE_TAG" --source-sha "$SOURCE_SHA"
