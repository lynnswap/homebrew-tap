name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      compatibility_matrix: ${{ steps.compatibility.outputs.matrix }}
      has_compatible_bottles: ${{ steps.compatibility.outputs.has_bottles }}
      has_bottle_artifacts: ${{ steps.compatibility.outputs.has_artifacts }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-arm64-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-arm64-rubygems-

      - name: Test bottle compatibility tooling
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Register configured bottle compatibility
        id: compatibility
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/bottle_compatibility.py prepare \
            --config .github/bottle-compatibility.json --github-output "$GITHUB_OUTPUT"

      - name: Upload candidate bottles
        if: steps.compatibility.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-bottles
          path: '*.bottle.*'

  bottle-compatibility:
    name: Install ${{ matrix.formula }} on ${{ matrix.runner }}
    needs: test-bot
    if: needs.test-bot.outputs.has_compatible_bottles == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-bot.outputs.compatibility_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bottles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-bottles
          path: bottles

      - name: Install and test the registered bottle
        env:
          BOTTLE_JSON: ${{ matrix.bottle_json }}
          FORMULA: ${{ matrix.formula }}
        run: |
          python3 .github/scripts/bottle_compatibility.py test \
            --json "bottles/$BOTTLE_JSON" --formula "$FORMULA"

  verified-bottles:
    name: Make verified bottles available for publication
    needs: [test-bot, bottle-compatibility]
    if: >-
      always() && needs.test-bot.result == 'success' &&
      needs.test-bot.outputs.has_bottle_artifacts == 'true' &&
      (needs.test-bot.outputs.has_compatible_bottles != 'true' ||
       needs.bottle-compatibility.result == 'success')
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Download candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-bottles
          path: bottles

      - name: Upload publication artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_macos-arm64
          path: bottles/*.bottle.*
          if-no-files-found: error
