name: brew test-bot

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Bottle CI for PR {0} at {1}', inputs.pull_request, inputs.head_sha) || github.event.pull_request.title || github.event.head_commit.message }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Native Formula PR number
        required: true
        type: string
      head_sha:
        description: Pinned full native PR head SHA
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  guard-contracts:
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["lynnswap","github-actions[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  select-builder:
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["lynnswap","github-actions[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.builder.outputs.runner }}
      developer_dir: ${{ steps.builder.outputs.developer_dir }}
      custom_service: ${{ steps.builder.outputs.custom_service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Select the Formula build environment
        id: builder
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number || inputs.pull_request }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          args=()
          if [[ -n "$PULL_REQUEST" ]]; then
            args+=(--pr "$PULL_REQUEST" --head "$HEAD_SHA")
          fi
          python3 scripts/formula_builder.py --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

  test-bot:
    needs: select-builder
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ needs.select-builder.outputs.runner }}
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: ${{ needs.select-builder.outputs.developer_dir }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: macos-arm64-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: macos-arm64-rubygems-

      - name: Prepare trusted CI scripts
        if: github.event_name == 'workflow_dispatch' || needs.select-builder.outputs.runner == 'xcode-27'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          tap_root="$(brew --repository lynnswap/tap)"
          git -C "$tap_root" fetch origin "$WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/trusted-ci"
          for script in dispatched_ci.py approved_bottles.py bottle_tags.py; do
            git -C "$tap_root" show "$WORKFLOW_SHA:scripts/$script" > "$RUNNER_TEMP/trusted-ci/$script"
          done

      - name: Pin the native Formula checkout
        id: pinned
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          tap_root="$(brew --repository lynnswap/tap)"
          python3 "$RUNNER_TEMP/trusted-ci/dispatched_ci.py" prepare --repo "$GITHUB_REPOSITORY" \
            --pr "$PULL_REQUEST" --head "$HEAD_SHA" --tap-root "$tap_root" \
            --github-output "$GITHUB_OUTPUT"

      - run: brew test-bot --only-cleanup-before

      - name: Restore the pinned head after cleanup
        if: github.event_name == 'workflow_dispatch'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: git -C "$(brew --repository lynnswap/tap)" checkout --detach "$HEAD_SHA"

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
      - name: Build and test the pinned native Formulae
        if: github.event_name == 'workflow_dispatch'
        env:
          FORMULAE: ${{ steps.pinned.outputs.formulae }}
          ADDED_FORMULAE: ${{ steps.pinned.outputs.added_formulae }}
        run: |
          brew test-bot --only-formulae --testing-formulae="$FORMULAE" --added-formulae="$ADDED_FORMULAE"

      - name: Register custom service bottles for macOS 26 and later
        if: needs.select-builder.outputs.custom_service == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: python3 "$RUNNER_TEMP/trusted-ci/bottle_tags.py" .

      - name: Upload bottles as artifact
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_macos-arm64_${{ github.run_id }}_${{ github.run_attempt }}
          path: '*.bottle.*'
          retention-days: 35

  install-custom-service:
    name: Install the custom service bottle on macOS 26
    needs: [select-builder, test-bot]
    if: needs.select-builder.outputs.custom_service == 'true' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bottles_macos-arm64_${{ github.run_id }}_${{ github.run_attempt }}
          path: ${{ runner.temp }}/bottles
      - name: Install the tested bottle without forcing bottle selection
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          formula=lynnswap/tap/custom-xcode-build-service
          tap_root="$(brew --repository lynnswap/tap)"
          git -C "$tap_root" fetch origin "$HEAD_SHA"
          git -C "$tap_root" checkout --detach "$HEAD_SHA"
          brew bottle --merge --write --no-commit "$RUNNER_TEMP/bottles/"*.bottle.json
          cache="$(brew --cache --force-bottle "$formula")"
          mkdir -p "$(dirname "$cache")"
          cp "$RUNNER_TEMP/bottles/"*.bottle*.tar.gz "$cache"
          brew install "$formula"
          brew info --json=v2 "$formula" | python3 -c '
          import json, sys
          if not json.load(sys.stdin)["formulae"][0]["installed"][0]["poured_from_bottle"]:
              sys.exit("Homebrew rebuilt the service instead of installing its macOS 26 bottle.")
          '
          prefix="$(brew --prefix "$formula")"
          "$prefix/bin/custom-xcode-build-service" --version
          python3 "$prefix/share/custom-xcode-build-service/verify.py" verify-payload \
            --payload "$prefix/libexec" \
            --fixture-dir "$prefix/share/custom-xcode-build-service/CommandLineTool"

  publish-tested-bottles:
    needs: [guard-contracts, test-bot, install-custom-service]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      needs.guard-contracts.result == 'success' && needs.test-bot.result == 'success' &&
      (needs.install-custom-service.result == 'success' || needs.install-custom-service.result == 'skipped')
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/publish.yml
    with:
      pull_request: ${{ inputs.pull_request }}
      head_sha: ${{ inputs.head_sha }}
      ci_run_id: ${{ github.run_id }}
