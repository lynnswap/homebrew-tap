name: Propose Homebrew updates

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      source_repository:
        description: Registered source repository that prepared a stable tag
        required: false
        type: string
      source_tag:
        description: Public stable vX.Y.Z source tag
        required: false
        type: string

permissions: {}

concurrency:
  group: renovate-formula-updates
  queue: max
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update: ${{ steps.proposal.outputs.update }}
      priority_update: ${{ steps.proposal.outputs.priority_update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check for an unproposed public source tag
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          args=()
          if [[ -n "$SOURCE_REPOSITORY" || -n "$SOURCE_TAG" ]]; then
            args+=(--source-repository "$SOURCE_REPOSITORY" --source-tag "$SOURCE_TAG")
          elif [[ "$EVENT_NAME" == workflow_dispatch || "$SCHEDULE" == '17 23 * * *' ]]; then
            args+=(--maintenance)
          fi
          python3 scripts/prepared_update.py --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

  renovate:
    needs: candidate
    if: needs.candidate.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Check out trusted bot configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Remove the hourly PR throttle for a verified release notification
        if: needs.candidate.outputs.priority_update == 'true'
        run: echo 'RENOVATE_PR_HOURLY_LIMIT=0' >> "$GITHUB_ENV"
      - name: Propose configured Formula updates
        uses: renovatebot/github-action@6d26fcf0275dc65624cbc3d51fe78bc773f98321 # v46.3.6
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ github.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.124.2@sha256:aa912e916788c5f594cf92f99a7bc01697bbaf4c77fce68e9dcef6c1bbd730b9

  dispatch-ci:
    needs: [candidate, renovate]
    if: >-
      always() && needs.candidate.result == 'success' &&
      (needs.renovate.result == 'success' || needs.renovate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Start read-only CI for pinned native proposals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatched_ci.py dispatch --repo "$GITHUB_REPOSITORY"
