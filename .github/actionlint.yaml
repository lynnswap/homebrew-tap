self-hosted-runner:
  # GitHub-hosted preview image: https://github.com/actions/runner-images/issues/14404
  labels:
    - xcode-27
paths:
  # Homebrew passes tap paths outside the workspace symlink; match that prefix.
  '**/.github/workflows/*.yml':
    ignore:
      # Remove when actionlint supports GitHub's documented concurrency.queue.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
      - '^unexpected key "queue" for "concurrency" section\.'
